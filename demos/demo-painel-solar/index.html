<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <!-- Define a codificação de caracteres em UTF-8, garantindo suporte a acentos e caracteres especiais -->
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <!-- Título da página, aparecendo na aba do navegador e resultados de busca -->
    <title>Painel Solar | Simulador e Benefícios da Energia Solar</title>
    <!-- Descrição para motores de busca e redes sociais, resumindo o conteúdo da página -->
    <meta name="description" content="Painel Solar — Simulador de energia solar fotovoltaica, cálculo de economia, benefícios ambientais e orçamento para instalação de painéis solares." />
    <meta name="author" content="MOSS Digital" />
    <!-- URL canônica padrão, indicando a fonte original do conteúdo -->
    <link rel="canonical" href="https://painelsolar.energia/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:type" content="website" />
    <!-- Define o nome do site para tags Open Graph -->
    <meta property="og:site_name" content="Painel Solar" />
    <!-- Define o locale (idioma e região) para correta interpretação de dados -->
    <meta property="og:locale" content="pt_BR" />
    <!-- Título otimizado para compartilhamento em redes sociais -->
    <meta property="og:title" content="Painel Solar | Simulador e Benefícios da Energia Solar" />
    <!-- Descrição otimizada para compartilhamento em redes sociais -->
    <meta property="og:description" content="Simulador de energia solar fotovoltaica, cálculo de economia, benefícios ambientais e orçamento para instalação de painéis solares." />
    <!-- Imagem principal para compartilhamento em redes sociais (Open Graph) -->
    <meta property="og:image" content="assets/img/casa-com-painel.webp" />
    <!-- Configuração do cartão para Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Título para compartilhamento no Twitter/X -->
    <meta name="twitter:title" content="Painel Solar | Simulador e Benefícios da Energia Solar" />
    <!-- Descrição para compartilhamento no Twitter/X -->
    <meta name="twitter:description" content="Simulador de energia solar fotovoltaica, cálculo de economia, benefícios ambientais e orçamento para instalação de painéis solares." />
    <!-- Imagem para compartilhamento no Twitter/X -->
    <meta name="twitter:image" content="assets/img/casa-com-painel.webp" />
    <!-- Begini blocos de estilo CSS embutido -->
    <style>
        /* ============================================================
         * Painel Solar - Paleta de Cores e Variáveis CSS
         * ============================================================
         * Define as variáveis CSS principais utilizadas em todo o layout.
         * Cores selecionadas transmitem confiança (#102A43), energia solar (#FFC531),
         * sucesso (#28A745) e ambiente positivo (#D4EDDA).
         * ============================================================
         */
        :root {
            /* ========== Cores da Identidade Visual ========== */
            --navy: #102A43;        /* Azul-marinho principal - transmitindo confiança, seriedade e profissionalismo */
            --yellow: #FFC531;      /* Yellow principal - usado para chamadas para ação, destaque e calor solar */
            --green: #28A745;       /* Green success - representa resultados positivos, economia e meio ambiente */
            --light-green: #D4EDDA; /* Green claro - usado para fundos de mensagens de sucesso */
            --white: #FFFFFF;       /* Branco - fundo limpo, legível e sem distrações */
            --dark-gray: #333333;   /* Cinza escuro - texto principal, contraste contra o fundo claro */
            --muted-gray: #6C757D;  /* Cinza médio - texto secundário, auxiliares, non-critical */
            --light-bg: #F8F9FA;    /* Fundo claro - pages, cards e áreas de fundo para reduzir fadiga visual */
        }

        /* ========== Reset e Base ========== */
        * {
            /* box-sizing: border-box garante que o padding e border sejam incluídos na largura total definida */
            box-sizing: border-box;
            /* Remove a margem padrão dos navegadores */
            margin: 0;
            /* Remove o padding padrão */
            padding: 0;
        }

        body {
            /* Define a fonte principal do sistema operacional do usuário com fallback */
            font: 16px/1.6 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Define a cor de fundo clara para conforto visual em longas sessões */
            background: var(--light-bg);
            /* Define a cor do texto principal */
            color: var(--dark-gray);
            /* Altura de linha consistente para melhor leitura */
            line-height: 1.6;
        }

        a {
            /* Remove o sublinhado padrão dos links */
            text-decoration: none;
            /* Herda a cor do elemento pai */
            color: inherit;
        }

        img {
            /* Imagem responsiva: nunca maior que o container pai */
            max-width: 100%;
            /* Mantém a proporção original da imagem */
            height: auto;
            /* Exibe como bloco para remover espaçamentos indesejados abaixo da imagem */
            display: block;
        }

        ul {
            /* Remove as bolinhas padrão das listas */
            list-style: none;
        }

        .container {
            /* Limita a largura máxima do conteúdo para linhas de texto confortáveis */
            max-width: 1200px;
            /* Centraliza o conteúdo horizontalmente na tela */
            margin: auto;
            /* Adiciona espaçamento interno consistente em todos os lados */
            padding: 0 25px;
        }

        /* ========== Header ========== */
        header {
            /* Fundo branco garante contraste máximo com o conteúdo abaixo */
            background: var(--white);
            /* Borda inferior sutil para separar o header do conteúdo principal */
            border-bottom: 1px solid #e0e0e0;
            /* Fixa o header no topo da viewport durante a rolagem da página */
            position: fixed;
            /* Garante que o header cobre toda a largura da tela */
            width: 100%;
            /* Posicionamento sobre outros elementos (menus modais, etc.) */
            z-index: 1000;
            /* Altura fixa consistente em todas as páginas */
            top: 0;
        }

        .top {
            /* Layout flexível: justify-content: space-between empurra o brand para esquerda e nav/cta para direita */
            min-height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* Espaçamento interno entre os filhos do container */
            gap: 25px;
            /* Permite que os itens se encaixem em linha se a tela for muito estreita */
            flex-wrap: wrap;
            /* Cor base do texto e elementos neste módulo */
            color: var(--white);
        }

        .brand {
            /* Tamanho e peso da fonte para o nome da marca */
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--navy);
            /* Pequeno espaçamento entre letras para sofisticação visual */
            letter-spacing: .03em;
        }

        .brand-logo {
            /* Largura responsiva: máximo 260px ou 65% da largura da viewport */
            display: inline-block;
            width: min(260px, 65vw);
            height: auto;
            max-height: 70px;
            /* Mantém a proporção da imagem e evita alongamento */
            object-fit: contain;
        }

        nav {
            /* Layout flexível que quebra em linha única em telas menores */
            display: flex;
            flex-wrap: wrap;
            /* Espaçamento consistente entre os links do menu */
            gap: 30px;
        }

        nav a {
            /* Cor do texto do link segue o navy da paleta */
            color: var(--navy);
            /* Tamanho de fonte consistente */
            font-size: .94rem;
            /* Peso medio-para-firme para destaque */
            font-weight: 600;
            /* Efeito de transição suave ao passar o mouse */
            transition: color 0.2s;
        }

        nav a:hover {
            /* Ao passar o mouse, muda para o yellow da paleta para indicar interatividade */
            color: var(--yellow);
        }

        .cta {
            /* Exibe como bloco inline para permitir width/height */
            display: inline-block;
            /* Espaçamento interno: topo/direita/baixo/esquerda */
            padding: 12px 25px;
            /* Cantos arredondados para aparência moderna */
            border-radius: 10px;
            /* Fundo yellow da paleta */
            background: var(--yellow);
            /* Cor do texto navy para contraste */
            color: var(--navy);
            /* Peso da fonte */
            font-weight: 700;
            /* Tamanho da fonte */
            font-size: 1rem;
            /* Efeito de transição suave ao passar o mouse */
            transition: background 0.2s;
        }

        .cta:hover {
            /* Yellow mais escima (#E0A825) ao passar o mouse */
            background: #E0A825;
        }

        /* ========== Hero (Primeira Tela) ========== */
        .hero {
            /* Padding superior e inferior grandes para criar impacto visual imediato */
            padding: 180px 25px 100px;
            /* Fundo navy transmite seriedade e profissionalismo */
            background: var(--navy);
            /* Cor branca para contraste máximo contra o fundo escuro */
            color: var(--white);
            /* Alinhamento centralizado para todos os elementos filhos */
            text-align: center;
            /* Position relative permite posicionar elementos filhos (como pseudo-elementos) */
            position: relative;
        }

        .hero::before {
            /* Conteúdo vazio usado como pseudo-elemento */
            content: '';
            /* Posição absoluta para cobrir toda a área do hero */
            position: absolute;
            /* Cobrir todo o retângulo do hero */
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* Fundo escurecido (rgba) para melhorar a legibilidade do texto branco em cima */
            background: rgba(0,0,0,0.3);
        }

        .eyebrow {
            /* Cor yellow do destaque o texto em destaque */
            color: var(--yellow);
            /* Tamanho de fonte menor para o "sublinhado" da página */
            font-size: .8rem;
            /* Espaçamento entre letras para destaque visual */
            letter-spacing: .15em;
            /* Peso da fonte mais forte */
            font-weight: 800;
            /* Transformação de texto para maiúsculas */
            text-transform: uppercase;
            /* Espaçamento abaixo para separar do título principal */
            margin-bottom: 20px;
        }

        .hero h1 {
            /* Título grande e responsivo usando clamp() para funcionar em qualquer tamanho de tela:
               2.8rem mínimo, 5vw médio, 3.8rem máximo */
            font-size: clamp(2.8rem, 5vw, 3.8rem);
            /* Largura máxima para o título não ficar muito alongado em telas grandes */
            max-width: 720px;
            /* Centraliza horizontalmente */
            margin: 0 auto 20px;
            /* Altura de linha confortável para títulos */
            line-height: 1.2;
        }

        .hero p {
            /* Cor azul-claro para contraste contra o fundo navy */
            color: #dce7f4;
            /* Largura máxima para o parágrafo não ficar muito largo em telas grandes */
            max-width: 600px;
            /* Centralizar horizontalmente */
            margin: 0 auto 30px;
            /* Fonte maior que o padrão para destaque */
            font-size: 1.1rem;
        }

        .hero-botoes {
            /* Flex container centralizado */
            display: flex;
            /* Espaçamento entre os botões */
            gap: 20px;
            /* Centralizar horizontalmente */
            justify-content: center;
            /* Permitir que os botões quebrem em linha em telas menores */
            flex-wrap: wrap;
        }

        /* ========== Seções ========== */
        .section {
            /* Espaçamento vertical consistente entre as seções */
            padding: 80px 0;
            /* Fundo branco para contraste contra o conteúdo */
            background: var(--white);
        }

        .section h2 {
            /* Tamanho da fonte para títulos de seção */
            font-size: 2rem;
            /* Cor navy para consistência visual */
            color: var(--navy);
            /* Centralizar o título */
            text-align: center;
            /* Margem inferior para separar do próximo elemento */
            margin-bottom: 40px;
            /* Posicionar como inline-block para adicionar a linha decorativa */
            display: inline-block;
            /* Posicionar a linha decorativa abaixo do título */
            position: relative;
        }

        .section h2::after {
            /* Criar a linha decorativa abaixo do título */
            content: '';
            /* Largura da linha decorativa */
            width: 60px;
            /* Altura da linha decorativa */
            height: 4px;
            /* Cor da linha segue o yellow da paleta */
            background: var(--yellow);
            /* Posicionar centralizado abaixo do título */
            position: absolute;
            /* Centralizar horizontalmente sobre o título */
            left: 50%;
            /* Ajustar posição: metade da largura da linha para a esquerda */
            transform: translateX(-50%);
            /* Posicionar abaixo do título com um pequeno espaço */
            bottom: -16px;
        }

        .section p {
            /* Cor gray-muted para texto de apoio, não competir com os títulos */
            color: var(--muted-gray);
            /* Largura máxima para não atrapalhar a leitura em telas grandes */
            max-width: 700px;
            /* Centralizar horizontalmente */
            margin: 0 auto 30px;
            /* Alinhamento de texto para melhor leitura */
            text-align: center;
            /* Tamanho de fonte ligeiramente maior que o padrão */
            font-size: 1.05rem;
        }

        /* ========== Calculadora ========== */
        .calculadora {
            /* Largura máxima para o formulário não ficar muito largo */
            max-width: 600px;
            /* Centralizar o formulário horizontalmente */
            margin: 0 auto;
            /* Espaçamento interno */
            padding: 40px;
            /* Fundo light-bg para suavizar a contraste */
            background: var(--light-bg);
            /* Borda sutil para definir o contorno do formulário */
            border-radius: 16px;
            border: 1px solid #e0e0e0;
        }

        .calculadora h3 {
            /* Centralizar o título do formulário */
            text-align: center;
            /* Margem inferior para separar do formulário */
            margin-bottom: 30px;
            /* Cor navy para consistência */
            color: var(--navy);
        }

        .calculadora .form-group {
            /* Margem inferior para separar cada campo do formulário */
            margin: 0 0 20px;
        }

        .calculadora label {
            /* Exibir como bloco para empurrar a label acima do input */
            display: block;
            /* Margem inferior para separar label do input */
            margin: 0 0 8px;
            /* Peso da fonte mais forte */
            font-weight: 600;
            /* Cor dark-gray para contraste */
            color: var(--dark-gray);
        }

        .calculadora input,
        .calculadora select,
        .calculadora input[type="range"] {
            /* Largura total do container de formulário */
            width: 100%;
            /* Espaçamento interno confortável */
            padding: 12px;
            /* Borda suave para campos de formulário */
            border: 1px solid #ddd;
            /* Borda arredondada para aparência moderna */
            border-radius: 8px;
            /* Tamanho da fonte consistente */
            font-size: 1rem;
            /* Transição suave quando o foco muda */
            transition: border-color 0.2s;
        }

        .calculadora input:focus,
        .calculadora select:focus {
            /* Remover o outline padrão do navegador */
            outline: none;
            /* Borda yellow quando o campo está em foco */
            border-color: var(--yellow);
        }

        .calculadora .range-label {
            /* Exibir o rótulo do range em formato de linha dupla */
            display: flex;
            /* Distribuir espaço entre o rótulo e o valor */
            justify-content: space-between;
            /* Margem superior para separar do range */
            margin-top: 10px;
            /* Tamanho de fonte menor para info de apoio */
            font-size: .85rem;
            /* Cor muted-gray para texto de apoio */
            color: var(--muted-gray);
        }

        .calculadora button {
            /* Largura total do container de formulário */
            width: 100%;
            /* Espaçamento interno */
            padding: 14px;
            /* Fundo yellow da paleta */
            background: var(--yellow);
            /* Sem border para manter o foco no fundo */
            border: none;
            /* Borda arredondada para aparência moderna */
            border-radius: 8px;
            /* Tamanho da fonte */
            font-size: 1.1rem;
            /* Peso da fonte mais forte */
            font-weight: 700;
            /* Cursor do tipo pointer para indicar interatividade */
            cursor: pointer;
            /* Margem superior para separar do campo anterior */
            margin-top: 20px;
        }

        .calculadora button:hover {
            /* Yellow mais escima (#E0A825) ao passar o mouse */
            background: #E0A825;
        }

        /* ========== Resultado do Simulador ========== */
        .resultado {
            /* Margem superior para separar do formulário */
            margin-top: 30px;
            /* Padding interno */
            padding: 20px;
            /* Fundo light-green para indicar sucesso/positivo */
            background: var(--light-green);
            /* Borda arredondada */
            border-radius: 10px;
            /* Escondido por padrão */
            display: none;
            /* Alinhar items em fila central */
            align-items: center;
            justify-content: center;
        }

        .resultado.ativo {
            /* Mostrar o resultado quando a classe 'ativo' for adicionada */
            display: flex;
        }

        .valor {
            /* Tamanho de fonte maior para destaque */
            font-size: 1.5rem;
            /* Peso da fonte mais forte */
            font-weight: 700;
            /* Cor green para indicar valor positivo */
            color: var(--green);
            /* Espaço ao lado do próximo elemento */
            margin-right: 20px;
        }

        /* ========== Benefícios ========== */
        .beneficios-grid {
            /* Layout grid para organizar os cartões de benefícios */
            display: grid;
            /* Espaçamento interno entre os cartões */
            gap: 30px;
        }

        @media(min-width:768px) {
            /* Em telas de tablet, mostrar 3 cards por linha */
            .beneficios-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media(min-width:1024px) {
            /* Em desktops, mostrar 4 cards por linha */
            .beneficios-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .beneficio-card {
            /* Padding interno do cartão */
            padding: 30px;
            /* Fundo white para contrastar com os ícones */
            background: var(--white);
            /* Bordas arredondadas para aparência moderna */
            border-radius: 16px;
            /* Texto centralizado */
            text-align: center;
            /* Transição suave ao passar o mouse */
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .beneficio-card:hover {
            /* Ao passar o mouse, subir levemente */
            transform: translateY(-6px);
            /* Efeito de sombra aumentada */
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .beneficio-card .icone {
            /* Largura e altura fixas para o ícone */
            width: 60px;
            height: 60px;
            /* Centralizar horizontalmente */
            margin: 0 auto 20px;
            /* Fundo yellow da paleta */
            background: var(--yellow);
            /* Borda arredondada */
            border-radius: 50%;
            /* Layout flex: centralizar o conteúdo */
            display: flex;
            /* Centralizar vertical e horizontalmente */
            align-items: center;
            justify-content: center;
            /* Cor navy para contraste contra o fundo yellow */
            color: var(--navy);
            /* Tamanho da fonte do ícone */
            font-size: 1.8rem;
            /* Espaçamento abaixo do ícone */
            margin-bottom: 15px;
        }

        .beneficio-card h3 {
            /* Margem inferior para separar do ícone */
            margin: 0 0 8px;
            /* Cor navy para consistência */
            color: var(--navy);
            /* Tamanho da fonte */
            font-size: 1.2rem;
        }

        .beneficio-card p {
            /* Cor muted-gray para texto de apoio */
            color: var(--muted-gray);
            /* Tamanho de fonte */
            font-size: .9rem;
            /* Remover margem padrão */
            margin: 0;
        }

        /* ========== Galeria ========== */
        .galeria-grid {
            /* Layout grid para organizar os cards de projetos */
            display: grid;
            /* Espaçamento interno entre os cards */
            gap: 20px;
        }

        @media(min-width:600px) {
            /* Em telas de tablet, mostrar 2 cards por linha */
            .galeria-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media(min-width:850px) {
            /* Em laptops, mostrar 3 cards por linha */
            .galeria-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media(min-width:1200px) {
            /* Em desktops grandes, mostrar 4 cards por linha */
            .galeria-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .projeto-card {
            /* Bordas arredondadas */
            border-radius: 12px;
            /* Overflow hidden para recortar a imagem */
            overflow: hidden;
            /* Fundo white */
            background: var(--white);
            /* Efeito de aumento suave ao passar o mouse */
            transition: transform 0.3s;
        }

        .projeto-card:hover {
            /* Ao passar o mouse, aumentar levemente */
            transform: scale(1.02);
        }

        .projeto-card img {
            /* Imagem de cobertura total */
            width: 100%;
            /* Altura fixa para cards de projeto */
            height: 200px;
            /* Como a imagem deve se comportar - cobrir todo o mantendo a proporção */
            object-fit: cover;
        }

        .projeto-card .info {
            /* Padding interno para o texto do card */
            padding: 20px;
        }

        .projeto-card h3 {
            /* Margem inferior */
            margin: 0 0 8px;
            /* Cor navy */
            color: var(--navy);
            /* Tamanho da fonte */
            font-size: 1rem;
        }

        .projeto-card p {
            /* Cor muted-gray para texto de apoio */
            color: var(--muted-gray);
            /* Tamanho de fonte */
            font-size: .85rem;
            /* Remover margem padrão */
            margin: 0;
        }

        /* ========== Orçamento ========== */
        .orcamento {
            /* Largura máxima para o formulário orçamento */
            max-width: 500px;
            /* Centralizar horizontalmente */
            margin: 0 auto;
            /* Espaçamento interno */
            padding: 40px;
            /* Fundo light-bg */
            background: var(--light-bg);
            /* Borda arredondada */
            border-radius: 16px;
            /* Borda sutil */
            border: 1px solid #e0e0e0;
        }

        .orcamento h3 {
            /* Centralizar o título */
            text-align: center;
            /* Margem inferior */
            margin-bottom: 30px;
            /* Cor navy */
            color: var(--navy);
        }

        .orcamento .form-group {
            /* Margem inferior */
            margin: 0 0 20px;
        }

        .orcamento label {
            /* Exibir como bloco para empurrar a label acima do input */
            display: block;
            /* Margem inferior */
            margin: 0 0 8px;
            /* Peso da fonte mais forte */
            font-weight: 600;
            /* Cor dark-gray */
            color: var(--dark-gray);
        }

        .orcamento input,
        .orcamento select {
            /* Largura total do container */
            width: 100%;
            /* Espaçamento interno */
            padding: 12px;
            /* Borda suave */
            border: 1px solid #ddd;
            /* Borda arredondada */
            border-radius: 8px;
            /* Tamanho da fonte */
            font-size: 1rem;
        }

        .orcamento button {
            /* Largura total */
            width: 100%;
            /* Espaçamento interno */
            padding: 14px;
            /* Fundo yellow */
            background: var(--yellow);
            /* Sem border */
            border: none;
            /* Borda arredondada */
            border-radius: 8px;
            /* Tamanho da fonte */
            font-size: 1.1rem;
            /* Peso da fonte mais forte */
            font-weight: 700;
            /* Cursor do tipo pointer */
            cursor: pointer;
            /* Margem superior */
            margin-top: 20px;
        }

        .orcamento button:hover {
            /* Yellow mais escima (#E0A825) ao passar o mouse */
            background: #E0A825;
        }

        /* ========== Footer ========== */
        footer {
            /* Fundo navy para contraste */
            background: var(--navy);
            /* Cor branca para o texto */
            color: var(--white);
            /* Espaçamento vertical */
            padding: 60px 0 20px;
        }

        .footer .container {
            /* Layout grid para organizar os links */
            display: grid;
            /* Espaçamento interno */
            gap: 40px;
        }

        @media(min-width:768px) {
            /* Em tablets, mostrar 3 colunas no footer */
            .footer .container { grid-template-columns: repeat(3, 1fr); }
        }

        .footer-links h3 {
            /* Cor yellow para destaque */
            color: var(--yellow);
            /* Margem inferior */
            margin-bottom: 25px;
            /* Tamanho da fonte */
            font-size: 1.2rem;
        }

        .footer-links a {
            /* Exibir como bloco para lista vertical */
            display: block;
            /* Margem interna */
            margin: 8px 0;
            /* Cor dark-gray para links */
            color: var(--dark-gray);
            /* Tamanho da fonte */
            font-size: .95rem;
            /* Efeito de transição ao passar o mouse */
            transition: color 0.2s;
        }

        .footer-links a:hover {
            /* Ao passar o mouse, mudar para yellow */
            color: var(--yellow);
        }

        .footer-info p {
            /* Margem interna */
            margin: 12px 0;
            /* Tamanho de fonte menor */
            font-size: .9rem;
        }

        .social {
            /* Exibir os ícones de social em linha */
            display: flex;
            /* Espaçamento entre os ícones */
            gap: 15px;
        }

        .social a {
            /* Cada ícone de social tem tamanho fixo */
            width: 40px;
            height: 40px;
            /* Fundo yellow */
            background: var(--yellow);
            /* Cor navy */
            color: var(--navy);
            /* Bordas arredondadas */
            border-radius: 50%;
            /* Layout flex: centralizar o conteúdo */
            display: flex;
            /* Centralizar vertical e horizontalmente */
            align-items: center;
            justify-content: center;
            /* Tamanho da fonte do ícone */
            font-size: 1.1rem;
            /* Efeito de transição ao passar o mouse */
            transition: background 0.2s;
        }

        .social a:hover {
            /* Ao passar o mouse, mudar para #E0A825 */
            background: #E0A825;
        }

        /* ========== Topo CTA ========== */
        .topo-cta {
            /* Fixar na parte bottom da viewport */
            position: fixed;
            /* Cobrir toda a largura */
            left: 0;
            right: 0;
            bottom: 0;
            /* Fundo yellow claro */
            background: #ffef8a;
            /* Cor navy */
            color: var(--navy);
            /* Texto centralizado */
            text-align: center;
            /* Padding vertical */
            padding: 20px 0;
            /* Camada sobre outros elementos */
            z-index: 900;
        }

        .topo-cta .wrap {
            /* Largura máxima */
            max-width: 1200px;
            /* Centralizar horizontalmente */
            margin: auto;
            /* Padding interno */
            padding: 0 25px;
            /* Layout flex: justify-content entre os itens, align-itens no centro */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media(max-width:600px) {
            /* Em telas muito estreitas, colocar os itens em coluna */
            .topo-cta .wrap { flex-direction: column; gap: 15px; }
        }

        /* ========== Responsivo ========== */
        @media(max-width:768px) {
            /* Em telas menores, centralizar o topo */
            .topo { justify-content: center; }
            nav { justify-content: center; }
            /* Reduzir o padding do hero para caber em telas menores */
            .hero { padding: 150px 15px 60px; }
            /* Reduzir o padding das seções */
            .section { padding: 50px 0; }
            /* Reduzir margem dos calculadora/orçamento */
            .calculadora, .orcamento { margin: 0 15px; }
            /* Grid de benefícios em coluna única em mobile */
            .beneficios-grid { grid-template-columns: 1fr; }
            /* Reduzir o gap no footer */
            .footer .container { gap: 25px; }
        }
