      function shell(){const u=current(),o=org();return `<div class="sidebar-cover ${menuOpen?'open':''}" data-action="menu-close"></div><div class="shell"><aside class="sidebar ${menuOpen?'open':''}" aria-label="Menu da plataforma"><div class="brand"><span class="brand-badge">M</span><span>MOVIMENTA <em>PRIME</em></span></div><div class="school-box"><span class="school-icon">🏫</span><div><strong>${esc(o?.name||'Minha escola')}</strong><small>${esc(o?.city||'')}</small></div></div><div class="nav-label">${portal==='adultos'?'ÁREA ADULTA':'ÁREA INFANTOJUVENIL'} · ${u.role==='aluno'?'DO ALUNO':u.role==='gestor'?'DE GESTÃO':'DO PROFESSOR'}</div><nav class="nav-items">${menuFor(u.role).map(([id,icon,label])=>`<button type="button" class="nav-item ${view===id?'active':''}" data-action="navigate" data-id="${id}" ${view===id?'aria-current="page"':''}><span class="ni">${icon}</span><span>${label}</span></button>`).join('')}</nav><div class="side-bottom"><div class="side-user"><div class="avatar">${esc(initial(u.name))}</div><div><b>${esc(u.name)}</b><span>${roleLabel(u.role)}</span></div></div><button class="side-logout" type="button" data-action="logout">↪ Sair da conta</button></div></aside><div class="workspace"><header class="topbar"><div class="flex"><button class="mobile-menu" type="button" data-action="menu-toggle" aria-label="Abrir menu">☰</button><div><div class="topbar-title">${esc(viewNames[view]||'MOVIMENTA PRIME')}</div><div class="topbar-meta">${esc(o?.name||'')} · ${dateFmt(today())}</div></div></div><div class="topbar-right"><span class="top-chip"><span class="dot"></span>${portal==='adultos'?'Adultos · Demo local':'Infantojuvenil · Demo'}</span><div class="avatar" title="${esc(u.name)}">${esc(initial(u.name))}</div></div></header><main class="content" id="mainContent"><div class="info-banner">⚠️ <span><b>${portal==='adultos'?'Educação Física para adultos':'Área infantojuvenil demonstrativa'}:</b> perfis fictícios e acesso sem proteção real. ${portal==='infantil'?'Na versão real, apenas pessoas autorizadas poderão consultar informações de estudantes menores.':'Professor, alunos e gestor têm telas próprias.'} Não informe dados reais.</span></div><div id="viewBody">${viewBody()}</div></main></div></div>`}

      function viewBody(){return ({inicio:dashboard,turmas:classesView,usuarios:usersView,planos:plansView,atividades:tasksView,frequencia:attendanceView,avaliacoes:feedbackView,agenda:agendaView,avisos:noticesView,relatorios:reportsView,biblioteca:libraryView}[view]||dashboard)()}
      /* 10 — Painel de indicadores dinâmico, específico para cada perfil. */
      function dashboard(){const u=current(),cls=assignedClasses(),ids=visibleClassIds(),plans=visiblePlans(),tasks=visibleTasks();
        const studentCount=new Set(cls.flatMap(c=>c.studentIds)).size;

          const myTasks=tasks.filter(t=>!data.submissions.some(s=>s.taskId===t.id&&s.studentId===u.id));

          <div class="grid two"><div class="card card-pad"><div class="card-head"><h3>📚 Próximas atividades</h3>${btn('navigate','Ver todas','atividades','small')}</div>${myTasks.length?`<div class="list">${myTasks.slice(0,4).map(t=>`<div class="list-row"><div><strong>${esc(t.title)}</strong><p>${esc(classOf(t.classId)?.name||'')} · Entregar até ${shortDate(t.due)}</p></div>${pill('Pendente','orange')}</div>`).join('')}</div>`:empty('Tudo em dia!','Você concluiu as atividades disponíveis.','✨')}</div><div class="card card-pad"><div class="card-head"><h3>🌿 Minhas aulas</h3>${btn('navigate','Abrir','planos','small')}</div>${plans.slice(0,4).map(p=>`<div class="list-row"><div><strong>${esc(p.title)}</strong><p>${esc(p.unit)} · ${shortDate(p.date)}</p></div>${pill('Aula','gray')}</div>`).join('')||empty('Novas aulas em breve','Seu professor publicará os próximos planos.','🗓️')}</div></div>`;
        }
        const roleGest=u.role==='gestor';
        return `${header(roleGest?'Bem-vinda à gestão! 👋':'Bom trabalho, '+u.name.split(' ')[0]+'! 👋',roleGest?'Acompanhe professores, turmas e a aprendizagem da sua instituição.':'Seu espaço para planejar, acompanhar as turmas e compartilhar atividades.',roleGest?btn('open-user','＋ Cadastrar pessoa','','primary'):btn('open-lesson','＋ Criar plano de aula','','primary'))}
        <div class="grid four" style="margin-bottom:20px">${stat('▦',cls.length,'Turmas acompanhadas')}${stat('🎒',studentCount,portal==='adultos'?'Alunos adultos':'Estudantes fictícios')}${stat('▤',plans.length,'Planos de aula')}${stat('☑',tasks.length,'Atividades publicadas',countSub+' resposta(s) registrada(s)')}</div>
        <div class="overview-art card" style="margin-bottom:20px"><div style="position:relative;z-index:1"><span class="eyebrow" style="color:#8bf1c6">UM AMBIENTE PARA ENSINAR</span><h2>Planejamento, presença<br>e aprendizagem em um só lugar.</h2><p>Organize aulas alinhadas às práticas corporais, registre frequência e compartilhe devolutivas respeitosas.</p>${btn('navigate','Explorar turmas →','turmas','primary')}</div><div class="sports-art">🏀</div></div>
        <div class="grid two"><div class="card card-pad"><div class="card-head"><h3>📋 Planos próximos</h3>${btn('navigate','Ver planos','planos','small')}</div>${plans.length?`<div class="list">${[...plans].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4).map(p=>`<div class="list-row"><div class="flex"><div class="list-icon">${themeEmojis[p.unit]||'🏃'}</div><div><strong>${esc(p.title)}</strong><p>${esc(classOf(p.classId)?.name||'')} · ${shortDate(p.date)}</p></div></div>${pill(p.duration+' min')}</div>`).join('')}</div>`:empty('Sem planos','Crie seu primeiro planejamento.','📅')}</div>
        <div class="card card-pad"><div class="card-head"><h3>👥 Turmas em foco</h3>${btn('navigate','Todas as turmas','turmas','small')}</div>${cls.map(c=>`<div class="list-row"><div class="flex"><div class="list-icon">🏫</div><div><strong>${esc(c.name)}</strong><p>${esc(user(c.teacherId)?.name||'Sem professor')} · ${esc(c.period)}</p></div></div><span class="chip gray">${c.studentIds.length} alunos</span></div>`).join('')||empty('Sem turmas','Cadastre a primeira turma da instituição.','🏫')}</div></div>`;
      }
      const empty=(title,desc,icon='📂')=>`<div class="empty"><span class="icon">${icon}</span><strong>${esc(title)}</strong><div>${esc(desc)}</div></div>`;
      /* 11 — Gestão de turmas e participantes, sempre dentro da instituição escolhida. */
      function classesView(){const u=current(),cls=assignedClasses(),mayAdd=canManageOrg();
        return `${header(u.role==='aluno'?'Minha turma':'Turmas e professores','Organização das turmas, responsáveis e participantes fictícios.',mayAdd?btn('open-class','＋ Criar turma','','primary'):'')}
        <div class="grid three">${cls.map(c=>`<article class="card course-card"><div class="course-color">${c.name.includes('5º')?'🎯':c.name.includes('6º')?'🏀':c.name.includes('7º')?'🏐':'🥇'}</div><h3>${esc(c.name)}</h3><p>Prof. ${esc(user(c.teacherId)?.name||'A definir')}<br>${esc(c.period)} · Educação Física</p><div class="course-meta">${pill(c.studentIds.length+' estudantes')}${pill(data.lessons.filter(p=>p.classId===c.id).length+' planos','gray')}</div><div class="course-footer"><div class="pill-avatars">${studentsIn(c).slice(0,4).map(s=>`<div class="avatar" title="${esc(s.name)}">${esc(initial(s.name))}</div>`).join('')}</div>${btn('class-detail','Ver turma →',c.id,'small')}</div></article>`).join('')||empty('Nenhuma turma disponível','Esta conta não está vinculada a turmas.','🏫')}</div>`;
      }
      function classDetail(id){const c=classOf(id);if(!c||!visibleClassIds().includes(id))return toast('Turma indisponível.');const teacher=user(c.teacherId),people=studentsIn(c);openModal('Turma: '+c.name,'Dados de demonstração. Somente turmas acessíveis a este perfil.',`<div class="strip" style="margin-bottom:19px">${pill(teacher?.name||'Sem professor')}${pill(people.length+' estudantes','gray')}${pill(c.period,'orange')}</div><div class="card" style="box-shadow:none;padding:14px"><div class="card-head"><h3>Lista de participantes</h3></div>${people.map(p=>`<div class="list-row"><div class="portrait-row"><div class="avatar">${esc(initial(p.name))}</div><b>${esc(p.name)}</b></div><small>Perfil fictício</small></div>`).join('')||empty('Sem estudantes','O gestor pode cadastrar estudantes.')}</div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Fechar</button></div>`)}
      /* 12 — Cadastro fictício de usuários (somente gestor). */
      function usersView(){if(!canManageOrg())return empty('Acesso restrito','Somente gestores ou professores autônomos visualizam esta área.');const people=scoped(data.users).filter(u=>current().role==='gestor'||u.role==='aluno');
        return `${header(current().role==='gestor'?'Professores e estudantes':'Meus alunos', 'Gerencie contas fictícias da sua organização.',btn('open-user','＋ Cadastrar pessoa','','primary'))}
        <div class="card card-pad"><div class="card-head"><h3>Contas da instituição</h3>${pill(people.length+' perfis','gray')}</div><div class="table-wrap"><table class="data-table"><thead><tr><th>Nome</th><th>Perfil</th><th>Usuário</th><th>Turma</th></tr></thead><tbody>${people.map(p=>`<tr><td><div class="portrait-row"><span class="avatar">${esc(initial(p.name))}</span><strong>${esc(p.name)}</strong></div></td><td>${pill(roleLabel(p.role),p.role==='aluno'?'purple':'')}</td><td><code>${esc(p.username)}</code></td><td>${esc(assignedText(p))}</td></tr>`).join('')}</tbody></table></div></div>`;
      }
      function assignedText(p){if(p.role==='gestor')return 'Gestão';const cs=data.classes.filter(c=>c.orgId===p.orgId&&(c.audience||'infantil')===portal&&(p.role==='professor'?c.teacherId===p.id:c.studentIds.includes(p.id)));return cs.map(c=>c.name).join(', ')||'Sem turma'}
      /* 13 — Planos didáticos completos: objetivos, tempos, BNCC, materiais e adaptações. */
      function plansView(){const u=current(),plans=visiblePlans().filter(p=>filter==='todos'||p.unit===filter).filter(p=>(p.title+' '+p.unit+' '+classOf(p.classId)?.name).toLowerCase().includes(query.toLowerCase()));
        return `${header(u.role==='aluno'?'Minhas aulas':'Planos de aula',u.role==='aluno'?'Consulte os temas, objetivos e materiais publicados para sua turma.':'Crie planos completos, com etapas e observações de acessibilidade.',u.role!=='aluno'?btn('open-lesson','＋ Novo plano','','primary'):'')}
        <div class="toolbar"><input class="search" id="textSearch" placeholder="Buscar pelo tema, título ou turma…" value="${esc(query)}" aria-label="Buscar planos"><select class="select" id="unitFilter" aria-label="Filtrar unidade temática"><option value="todos">Todas as unidades</option>${themes.map(t=>`<option value="${esc(t)}" ${filter===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>

      function lessonDetail(id){const p=data.lessons.find(p=>p.id===id);if(!p||!visibleClassIds().includes(p.classId))return toast('Plano indisponível.');openModal('Plano de aula',p.title,`<div class="badge-line">${pill(p.unit)}${pill(classOf(p.classId)?.name||'','gray')}${pill(p.duration+' minutos','orange')}${pill(dateFmt(p.date),'gray')}</div><h3 style="font-size:22px;margin:22px 0 10px">${esc(p.title)}</h3><div class="note"><b>Objetivo:</b> ${esc(p.objective)}</div><div class="lesson-steps"><div class="lesson-step"><span class="t">Início</span><p>${esc(p.warmup)}</p></div><div class="lesson-step"><span class="t">Prática</span><p>${esc(p.development)}</p></div><div class="lesson-step"><span class="t">Fechamento</span><p>${esc(p.cooldown)}</p></div></div><p><b>Materiais:</b> ${esc(p.materials)}</p><p><b>Acessibilidade e adaptações:</b> ${esc(p.adaptations)}</p><p><b>Avaliação formativa:</b> ${esc(p.assessment)}</p><div class="note">BNCC / currículo: ${esc(p.bncc)}. A seleção de habilidades deve ser validada pelo professor conforme a série e a rede de ensino.</div><div class="modal-foot">${btn('export-lesson','↓ Exportar plano',p.id,'small')}${canEditClass(p.classId)&&current().role!=='aluno'?btn('edit-lesson','Editar plano',p.id,'primary'):''}<button class="btn" type="button" data-action="close-modal">Fechar</button></div>`)}
      /* 14 — Atividades e respostas dos alunos. */
      function tasksView(){const u=current(),tasks=visibleTasks().sort((a,b)=>a.due.localeCompare(b.due));return `${header(u.role==='aluno'?'Minhas atividades':'Atividades das turmas',u.role==='aluno'?'Consulte orientações e envie respostas de texto para a demonstração.':'Publique propostas de estudo e acompanhe as respostas.',u.role!=='aluno'?btn('open-task','＋ Nova atividade','','primary'):'')}
        <div class="grid two">${tasks.map(t=>{const mine=data.submissions.find(s=>s.taskId===t.id&&s.studentId===u.id);const sent=data.submissions.filter(s=>s.taskId===t.id).length;return `<article class="card activity-card"><div class="activity-top"><div class="activity-icon">${themeEmojis[t.unit]||'📝'}</div>${pill(u.role==='aluno'?(mine?'Enviada':'A fazer'):sent+' resposta(s)',u.role==='aluno'&&!mine?'orange':'')}</div><h3>${esc(t.title)}</h3><p>${esc(t.description)}</p><div class="strip">${pill(classOf(t.classId)?.name||'Turma','gray')}${pill('Até '+shortDate(t.due),'orange')}</div><div class="activity-foot">${u.role==='aluno'?btn('open-submit',mine?'Ver / editar resposta':'Responder atividade',t.id,mine?'small':'primary'):btn('task-responses','Ver respostas →',t.id,'small')}</div></article>`}).join('')||empty('Nenhuma atividade','Publicações da turma aparecerão aqui.','☑')}</div>`}
      function responses(id){const t=data.tasks.find(t=>t.id===id);if(!t||!canEditClass(t.classId))return toast('Sem permissão para consultar respostas.');const cls=classOf(t.classId);const list=studentsIn(cls);openModal('Respostas da turma',t.title,`<div class="note" style="margin-bottom:15px">${esc(t.description)}</div>${list.map(st=>{const r=data.submissions.find(x=>x.taskId===id&&x.studentId===st.id);return `<div class="list-row"><div><strong>${esc(st.name)}</strong><p>${r?esc(r.text):'Ainda não respondeu.'}</p></div>${pill(r?'Enviada':'Pendente',r?'':'orange')}</div>`}).join('')}<div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Fechar</button></div>`)}
      /* 15 — Frequência registrada por turma e data, sem monitoramento físico. */
      function attendanceView(){const u=current(),cls=assignedClasses(),records=data.attendance.filter(x=>x.orgId===u.orgId&&visibleClassIds().includes(x.classId));
        if(u.role==='aluno'){const my=records.map(r=>({date:r.date,cls:classOf(r.classId)?.name||'',status:r.records[u.id]})).filter(x=>x.status);return `${header('Minha frequência','Consulte seus registros de presença fictícios.')}<div class="card card-pad">${my.map(x=>`<div class="list-row"><div><strong>${dateFmt(x.date)}</strong><p>${esc(x.cls)}</p></div>${pill(cap(x.status),x.status==='ausente'?'orange':'')}</div>`).join('')||empty('Sem registros','O professor ainda não registrou a frequência.','✓')}</div>`}
        return `${header('Registro de frequência','Marque presença, ausência ou justificativa nas suas turmas.')}
        <div class="card card-pad" style="margin-bottom:18px"><form id="attForm" data-form="attendance"><div class="toolbar"><label class="form-field" style="margin:0;min-width:180px">Turma<select id="attendanceClass" name="classId" required>${cls.map(c=>`<option value="${c.id}" ${pickedClass===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="form-field" style="margin:0">Data<input id="attendanceDate" name="date" type="date" value="${esc(attDate)}" required></label></div><div id="attendancePeople">${attendancePeople(pickedClass||cls[0]?.id,attDate)}</div><div style="margin-top:17px"><button class="btn primary" type="submit" ${cls.length?'':'disabled'}>Salvar frequência</button></div></form></div><div class="card card-pad"><div class="card-head"><h3>Registros recentes</h3>${pill(records.length+' lista(s)','gray')}</div>${records.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(r=>`<div class="list-row"><div><strong>${esc(classOf(r.classId)?.name||'Turma')}</strong><p>${dateFmt(r.date)}</p></div>${pill(Object.values(r.records).filter(s=>s==='presente').length+' presentes')}</div>`).join('')||empty('Nenhum registro','Preencha a chamada acima.','✓')}</div>`;
      }
      function attendancePeople(clsId,date){const c=classOf(clsId);if(!c||!canEditClass(clsId))return empty('Turma indisponível','Selecione uma turma.','🗂');const records=data.attendance.find(a=>a.classId===clsId&&a.date===date)?.records||{};return `<div class="att-grid">${studentsIn(c).map(s=>`<div class="att-person"><div class="portrait-row"><span class="avatar">${esc(initial(s.name))}</span><b>${esc(s.name)}</b></div><select name="att-${esc(s.id)}" aria-label="Frequência de ${esc(s.name)}"><option value="presente" ${records[s.id]==='presente'?'selected':''}>Presente</option><option value="ausente" ${records[s.id]==='ausente'?'selected':''}>Ausente</option><option value="justificada" ${records[s.id]==='justificada'?'selected':''}>Justificada</option></select></div>`).join('')}</div>`}
      /* 16 — Devolutivas qualitativas, sem ranking de corpos ou desempenho físico. */
      function feedbackView(){const u=current(),visible=data.feedback.filter(f=>f.orgId===u.orgId&&visibleClassIds().includes(f.classId)&&(u.role!=='aluno'||f.studentId===u.id));
        return `${header(u.role==='aluno'?'Minhas devolutivas':'Avaliação formativa','Registros de colaboração, respeito e aprendizagem, sem comparação entre corpos.',u.role==='professor'?btn('open-feedback','＋ Registrar devolutiva','','primary'):'')}
          <div class="grid two">${visible.map(f=>`<article class="card card-pad"><div class="flex between" style="margin-bottom:13px">${pill(f.criterion)}<small>${dateFmt(f.date)}</small></div><h3 style="margin-bottom:6px">${u.role==='aluno'?'Sua aprendizagem':esc(user(f.studentId)?.name||'Estudante')}</h3><div class="rating">${esc(f.level)}</div><p class="muted" style="font-size:12px;margin:12px 0 0">${esc(f.text)}</p><div style="margin-top:12px">${pill(classOf(f.classId)?.name||'','gray')}</div></article>`).join('')||empty('Sem devolutivas ainda','O professor poderá registrar comentários formativos.','🌱')}</div>`;

        if(mode==='task'&&u.role!=='aluno'){if(!canEditClass(get('classId')))return toast('Turma indisponível.');data.tasks.unshift({id:makeId('a'),orgId:u.orgId,classId:get('classId'),authorId:u.id,title:get('title').slice(0,180),description:get('description').slice(0,800),due:get('due'),unit:get('unit')});ok=true;view='atividades'}
        if(mode==='submission'&&u.role==='aluno'){const task=data.tasks.find(t=>t.id===get('taskId'));if(!task||!visibleClassIds().includes(task.classId))return toast('Atividade indisponível.');const response=get('text').slice(0,1800),existing=data.submissions.find(s=>s.taskId===task.id&&s.studentId===u.id);if(existing){existing.text=response;existing.date=today()}else data.submissions.push({id:makeId('sub'),taskId:task.id,studentId:u.id,text:response,date:today()});ok=true;view='atividades'}
        if(mode==='attendance'&&u.role!=='aluno'){const cls=classOf(get('classId')),date=get('date');if(!cls||!canEditClass(cls.id))return toast('Turma indisponível.');const records={};studentsIn(cls).forEach(s=>{const v=get('att-'+s.id);records[s.id]=['presente','ausente','justificada'].includes(v)?v:'presente'});const old=data.attendance.find(x=>x.classId===cls.id&&x.date===date);if(old)old.records=records;else data.attendance.unshift({id:makeId('freq'),orgId:u.orgId,classId:cls.id,date,records});pickedClass=cls.id;attDate=date;ok=true;view='frequencia'}
        if(mode==='feedback'&&u.role==='professor'){const cls=classOf(get('classId'));if(!cls||!canEditClass(cls.id)||!cls.studentIds.includes(get('studentId')))return toast('Turma e estudante não correspondem.');data.feedback.unshift({id:makeId('f'),orgId:u.orgId,studentId:get('studentId'),classId:cls.id,authorId:u.id,criterion:get('criterion'),level:get('level'),text:get('text').slice(0,600),date:today()});ok=true;view='avaliacoes'}
        if(mode==='event'&&u.role!=='aluno'){const c=get('classId');if(c&&!canEditClass(c))return toast('Turma indisponível.');data.events.unshift({id:makeId('ev'),orgId:u.orgId,classId:c,title:get('title').slice(0,110),date:get('date'),details:get('details').slice(0,600)});ok=true;view='agenda'}
        if(mode==='notice'&&u.role!=='aluno'){const c=get('classId');if(c&&!canEditClass(c))return toast('Turma indisponível.');if(u.role==='professor'&&!c)return toast('Professor precisa escolher uma turma.');data.announcements.unshift({id:makeId('n'),orgId:u.orgId,authorId:u.id,classId:c,title:get('title').slice(0,110),text:get('text').slice(0,900),date:today()});ok=true;view='avisos'}
        if(ok){persist();if($('#modal')?.open)closeModal();query='';filter='todos';render();toast('Alteração salva nesta demonstração local.')}});
      document.addEventListener('input',ev=>{if(ev.target.id==='textSearch'){query=ev.target.value;const old=ev.target.selectionStart;const focused=true;$('#viewBody').innerHTML=viewBody();const next=$('#textSearch');if(next){next.focus();next.setSelectionRange(old,old)}}});
      document.addEventListener('change',ev=>{if(ev.target.id==='unitFilter'){filter=ev.target.value;$('#viewBody').innerHTML=viewBody()}if(ev.target.id==='attendanceClass'){pickedClass=ev.target.value;$('#attendancePeople').innerHTML=attendancePeople(pickedClass,$('#attendanceDate').value)}if(ev.target.id==='attendanceDate'){attDate=ev.target.value;$('#attendancePeople').innerHTML=attendancePeople($('#attendanceClass').value,attDate)}if(ev.target.id==='feedbackClass'){const cls=classOf(ev.target.value);const element=$('#feedbackStudent');if(cls&&element)element.innerHTML=studentsIn(cls).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}});
      $('#modal').addEventListener('click',ev=>{if(ev.target===$('#modal'))closeModal()});
      // 26 — Primeira renderização: nenhuma publicação ou conexão externa acontece.
      render();
    })();
  </script>
</body>
