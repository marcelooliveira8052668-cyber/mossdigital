<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MOSS Commerce Enterprise Academy — uma loja virtual completa para conhecer compras, pagamentos, entregas e aprender como a programação funciona por dentro. Demonstração 100% fictícia.">
  <meta name="theme-color" content="#0b1f3a">
  <title>MOSS Commerce Enterprise Academy</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Aplica o tema antes da primeira pintura para evitar "flash" claro/escuro. -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('moss_ca_theme_v1');
        var t = raw ? JSON.parse(raw) : 'light';
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/lab.css">
</head>
<body>
  <a class="skip-link" href="#app">Pular para o conteúdo</a>

  <!-- Aviso permanente: nada aqui movimenta dinheiro real. -->
  <div class="demo-banner" role="note">
    <span class="demo-banner__dot" aria-hidden="true"></span>
    <strong>AMBIENTE DE DEMONSTRAÇÃO</strong>
    <span>Compras, pagamentos e entregas são simulados. Nenhum dinheiro será movimentado.</span>
  </div>

  <div id="header-root"></div>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <div id="footer-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive" aria-atomic="true"></div>
  <div id="modal-root"></div>

  <!-- Ordem de carregamento importa: núcleo → dados → serviços → componentes → páginas → bootstrap.
       Todos os arquivos usam o padrão IIFE + namespace global, compatível com file:// e GitHub Pages. -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/notify.js"></script>
  <script src="js/core/theme.js"></script>
  <script src="js/core/router.js"></script>

  <script src="js/data/catalog.js"></script>
  <script src="js/data/coupons.js"></script>
  <script src="js/data/shipping.js"></script>
  <script src="js/data/technologies.js"></script>
  <script src="js/data/course.js"></script>
  <script src="js/data/lab-content.js"></script>

  <script src="js/services/api.service.js"></script>
  <script src="js/services/cart.service.js"></script>
  <script src="js/services/order.service.js"></script>
  <script src="js/services/payment.service.js"></script>
  <script src="js/services/logistics.service.js"></script>
  <script src="js/services/supabase.service.js"></script>
  <script src="js/services/admin.service.js"></script>

  <script src="js/components/ui.js"></script>
  <script src="js/components/layout.js"></script>
  <script src="js/components/product-card.js"></script>

  <script src="js/pages/home.js"></script>
  <script src="js/pages/store.js"></script>
  <script src="js/pages/product.js"></script>
  <script src="js/pages/cart.js"></script>
  <script src="js/pages/checkout.js"></script>
  <script src="js/pages/orders.js"></script>
  <script src="js/pages/tracking.js"></script>
  <script src="js/pages/admin.js"></script>
  <script src="js/pages/technologies.js"></script>
  <script src="js/pages/lab.js"></script>
  <script src="js/pages/career.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
