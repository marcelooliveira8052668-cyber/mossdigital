<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commerce Enterprise Academy — cartão de apresentação</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body{display:grid;place-items:center;min-height:100vh;padding:1.5rem;background:var(--bg)}
    .demo-card{max-width:520px;width:100%;padding:2rem;border-radius:var(--radius-lg);
      background:linear-gradient(135deg,var(--navy-900),var(--navy-600));color:#fff;box-shadow:var(--shadow-3)}
    .demo-card h1{color:#fff;font-size:2rem}
    .demo-card p{color:#cbd9ee}
    .demo-card .row{margin-top:1.4rem}
    .demo-card .btn--outline{border-color:rgba(255,255,255,.6);color:#fff}
    .selo{display:inline-block;padding:.25rem .6rem;border-radius:99px;background:var(--accent-500);color:var(--navy-900);font-size:.72rem;font-weight:800}
  </style>
</head>
<body>
  <article class="demo-card">
    <span class="selo">NOVA DEMONSTRAÇÃO · FICTÍCIA</span>
    <h1 style="margin-top:1rem">Commerce Enterprise Academy</h1>
    <p>Uma loja virtual completa para conhecer compras, pagamentos, entregas e aprender como a programação funciona por dentro.</p>
    <div class="row">
      <a class="btn btn--primary" href="index.html#/home">Acessar a loja →</a>
      <a class="btn btn--outline" href="index.html#/laboratorio">Laboratório de programação 🔬</a>
    </div>
  </article>
</body>
</html>
