<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Laser e depilação">
  <defs>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c2b3a"/><stop offset="1" stop-color="#062030"/></linearGradient>
    <radialGradient id="beam" cx=".5" cy=".35" r=".6">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".75"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#c1)"/>
  <ellipse cx="400" cy="230" rx="300" ry="200" fill="url(#beam)"/>

  <!-- aparelho -->
  <g transform="translate(400 210) rotate(14)">
    <rect x="-40" y="-120" width="80" height="210" rx="30" fill="url(#tip)"/>
    <rect x="-28" y="-100" width="56" height="60" rx="18" fill="#334155"/>
    <rect x="-20" y="-84" width="40" height="20" rx="10" fill="#67e8f9" opacity=".8"/>
    <path d="M-34 84h68l-10 46a24 24 0 0 1-48 0z" fill="#64748b"/>
  </g>

  <!-- raios -->
  <g stroke="#a5f3fc" stroke-width="3" stroke-linecap="round" opacity=".6">
    <path d="M400 340v120M350 350l-40 100M450 350l40 100M310 370l-58 70M490 370l58 70"/>
  </g>
  <circle cx="400" cy="352" r="12" fill="#67e8f9" opacity=".85"/>

  <!-- linhas de movimento -->
  <g stroke="#67e8f9" stroke-opacity=".28" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M120 200h70M610 200h70M90 250h50M660 250h50"/>
  </g>

  <rect x="0" y="470" width="800" height="130" fill="#041a26"/>
  <g fill="#fde68a" opacity=".5">
    <circle cx="200" cy="520" r="6"/><circle cx="400" cy="540" r="5"/><circle cx="600" cy="520" r="6"/>
  </g>
</svg>