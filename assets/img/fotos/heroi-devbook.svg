<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="DevBook - plataforma de curso Full Stack com editor de código e certificado">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a21"/>
      <stop offset="1" stop-color="#2b3140"/>
    </linearGradient>
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3c9d6"/>
      <stop offset="1" stop-color="#8f97a8"/>
    </linearGradient>
    <pattern id="grade" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#39404f" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="300" fill="url(#fundo)"/>
  <rect width="600" height="300" fill="url(#grade)" opacity=".5"/>
  <circle cx="540" cy="40" r="130" fill="#ffffff" opacity=".03"/>
  <circle cx="60" cy="270" r="110" fill="#ffffff" opacity=".025"/>

  <!-- editor de código -->
  <g>
    <rect x="34" y="44" width="300" height="176" rx="10" fill="#10131a" stroke="#3d4557" stroke-width="2"/>
    <rect x="34" y="44" width="300" height="30" rx="10" fill="#232833"/>
    <rect x="34" y="64" width="300" height="10" fill="#232833"/>
    <circle cx="52" cy="59" r="5" fill="#ff5f57"/>
    <circle cx="70" cy="59" r="5" fill="#febc2e"/>
    <circle cx="88" cy="59" r="5" fill="#28c840"/>

    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13">
      <text x="52" y="102" fill="#7f8898">const</text>
      <text x="100" y="102" fill="#c3c9d6">curso</text>
      <text x="150" y="102" fill="#7f8898">= {</text>
      <text x="68" y="124" fill="#9fb3c8">capitulos</text>
      <text x="150" y="124" fill="#7f8898">:</text>
      <text x="166" y="124" fill="#ffd21e">15</text>
      <text x="68" y="146" fill="#9fb3c8">desafios</text>
      <text x="150" y="146" fill="#7f8898">:</text>
      <text x="166" y="146" fill="#ffd21e">6</text>
      <text x="68" y="168" fill="#9fb3c8">deploy</text>
      <text x="140" y="168" fill="#7f8898">:</text>
      <text x="156" y="168" fill="#28c840">true</text>
      <text x="52" y="190" fill="#7f8898">};</text>
    </g>
    <rect x="52" y="196" width="9" height="15" fill="#c3c9d6" opacity=".85"/>
  </g>

  <!-- certificado -->
  <g>
    <rect x="366" y="60" width="200" height="146" rx="10" fill="#f6f7f9"/>
    <rect x="366" y="60" width="200" height="146" rx="10" fill="none" stroke="url(#acento)" stroke-width="3"/>
    <text x="466" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="15" font-weight="bold" fill="#171a21">CERTIFICADO</text>
    <rect x="392" y="112" width="148" height="6" rx="3" fill="#c3c9d6"/>
    <rect x="404" y="128" width="124" height="6" rx="3" fill="#d8dde6"/>
    <rect x="416" y="144" width="100" height="6" rx="3" fill="#e4e8ee"/>
    <!-- selo -->
    <circle cx="524" cy="176" r="18" fill="#ffd21e"/>
    <path d="M515 176l6 6 12-12" fill="none" stroke="#171a21" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="300" y="266" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="22" font-weight="bold" fill="#c3c9d6" letter-spacing="4">DEVBOOK</text>
  <text x="300" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="12" fill="#7f8898" letter-spacing="2">CURSO FULL STACK · DO ZERO AO DEPLOY</text>
</svg>
