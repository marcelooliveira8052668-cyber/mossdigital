<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Lanchonete do China - cardápio digital com carrinho e pedido pelo WhatsApp">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d62828"/>
      <stop offset="1" stop-color="#a61e1e"/>
    </linearGradient>
    <linearGradient id="pao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b955"/>
      <stop offset="1" stop-color="#e79a2d"/>
    </linearGradient>
    <pattern id="padrao" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2" fill="#ffffff" opacity=".05"/>
      <circle cx="19" cy="19" r="2" fill="#ffffff" opacity=".05"/>
    </pattern>
  </defs>

  <rect width="600" height="300" fill="url(#fundo)"/>
  <rect width="600" height="300" fill="url(#padrao)"/>
  <circle cx="545" cy="35" r="120" fill="#fcbf49" opacity=".12"/>
  <circle cx="45" cy="275" r="105" fill="#ffffff" opacity=".05"/>

  <!-- hambúrguer -->
  <g transform="translate(96 78)">
    <rect x="0" y="76" width="150" height="16" rx="8" fill="url(#pao)"/>
    <rect x="10" y="62" width="130" height="12" rx="6" fill="#7ab648"/>
    <rect x="6" y="48" width="138" height="14" rx="4" fill="#6b3f21"/>
    <rect x="14" y="38" width="122" height="10" rx="3" fill="#fcd34d"/>
    <path d="M0 34c0-19 24-30 75-30s75 11 75 30z" fill="url(#pao)"/>
    <circle cx="46" cy="20" r="2.5" fill="#fff3d6"/>
    <circle cx="74" cy="14" r="2.5" fill="#fff3d6"/>
    <circle cx="102" cy="20" r="2.5" fill="#fff3d6"/>
  </g>

  <!-- celular com o pedido -->
  <g transform="translate(310 40)">
    <rect x="0" y="0" width="132" height="220" rx="18" fill="#1e1e1e"/>
    <rect x="8" y="8" width="116" height="204" rx="12" fill="#fffaf2"/>
    <rect x="48" y="14" width="36" height="6" rx="3" fill="#1e1e1e"/>

    <text x="20" y="42" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#d62828">Meu pedido</text>
    <rect x="20" y="52" width="92" height="22" rx="6" fill="#f6e9d8"/>
    <text x="28" y="67" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#2b2b2b">1x X-Bacon</text>
    <rect x="20" y="80" width="92" height="22" rx="6" fill="#f6e9d8"/>
    <text x="28" y="95" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#2b2b2b">2x Guaraná</text>
    <rect x="20" y="108" width="92" height="8" rx="4" fill="#e7dcc9"/>
    <rect x="20" y="122" width="64" height="8" rx="4" fill="#efe4d1"/>
    <text x="20" y="152" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#2b2b2b">Total R$ 34,00</text>

    <rect x="20" y="164" width="92" height="26" rx="13" fill="#25d366"/>
    <text x="66" y="181" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#093b24">Enviar no zap</text>
  </g>

  <text x="300" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="22" font-weight="bold" fill="#fff3d6" letter-spacing="3">LANCHONETE DO CHINA</text>
  <text x="300" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="12" fill="#ffd9d9" letter-spacing="2">PEÇA PELO SITE · CAI NO WHATSAPP · ENTREGA GRÁTIS ACIMA DE R$45</text>
</svg>
