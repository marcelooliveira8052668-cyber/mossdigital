<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-label="Nosso espaço">
  <defs>
    <linearGradient id="ab2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b0a2b"/><stop offset="1" stop-color="#1c0517"/></linearGradient>
    <linearGradient id="gd2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="bl3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="38"/></filter>
  </defs>

  <rect width="640" height="560" fill="url(#ab2)"/>
  <g filter="url(#bl3)" opacity=".5">
    <circle cx="140" cy="130" r="120" fill="#db2777"/>
    <circle cx="510" cy="450" r="130" fill="#f59e0b"/>
  </g>

  <g fill="none" stroke="url(#gd2)" stroke-width="1.5" opacity=".4">
    <circle cx="320" cy="300" r="120"/>
    <circle cx="320" cy="300" r="190"/>
  </g>

  <!-- maca com toalha -->
  <rect x="110" y="330" width="420" height="36" rx="18" fill="#f7e6ef"/>
  <rect x="110" y="366" width="420" height="12" rx="6" fill="#dcc0d2" opacity=".75"/>
  <rect x="132" y="378" width="16" height="58" rx="8" fill="url(#gd2)"/>
  <rect x="492" y="378" width="16" height="58" rx="8" fill="url(#gd2)"/>

  <!-- vela -->
  <g>
    <rect x="452" y="266" width="26" height="54" rx="8" fill="#fde68a"/>
    <path d="M465 266c-8-10-2-18 0-24 4 8 8 14 0 24z" fill="#fb923c"/>
  </g>

  <!-- espelho redondo -->
  <circle cx="168" cy="200" r="66" fill="#fde68a" opacity=".18"/>
  <circle cx="168" cy="200" r="66" fill="none" stroke="url(#gd2)" stroke-width="3"/>

  <!-- folhagens -->
  <g stroke="#f9a8d4" stroke-opacity=".45" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M80 500c0-46 32-80 78-80"/>
    <path d="M560 500c0-46-32-80-78-80"/>
  </g>
</svg>