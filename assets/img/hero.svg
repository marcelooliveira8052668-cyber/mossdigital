<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-label="Carro para alugar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset=".5" stop-color="#152238"/><stop offset="1" stop-color="#070d18"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset=".55" stop-color="#2563eb"/><stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bae6fd"/><stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="800" height="620" fill="url(#bg)"/>

  <!-- brilho ambiente -->
  <ellipse cx="400" cy="250" rx="330" ry="190" fill="#2563eb" opacity=".16"/>
  <circle cx="620" cy="120" r="150" fill="#fbbf24" opacity=".07"/>

  <!-- pista -->
  <rect x="0" y="430" width="800" height="190" fill="url(#road)"/>
  <rect x="0" y="430" width="800" height="4" fill="#334155"/>
  <g fill="#fbbf24" opacity=".55">
    <rect x="40"  y="512" width="86" height="9" rx="4.5"/>
    <rect x="180" y="512" width="86" height="9" rx="4.5"/>
    <rect x="320" y="512" width="86" height="9" rx="4.5"/>
    <rect x="460" y="512" width="86" height="9" rx="4.5"/>
    <rect x="600" y="512" width="86" height="9" rx="4.5"/>
  </g>

  <!-- carro -->
  <g filter="url(#drop)">
    <path d="M112 404v-46c0-20 13-32 33-35l70-12c34-78 92-104 185-104s151 26 185 104l70 12c20 3 33 15 33 35v46z"
          fill="url(#body)"/>

    <!-- teto mais claro -->
    <path d="M232 311c30-64 78-86 168-86s138 22 168 86z" fill="#60a5fa" opacity=".55"/>

    <!-- vidros -->
    <path d="M262 306c26-52 66-70 138-70s112 18 138 70z" fill="url(#glass)"/>
    <path d="M400 236v70" stroke="#1e40af" stroke-width="7"/>
    <path d="M276 306h248" stroke="#1e40af" stroke-width="5" opacity=".55"/>

    <!-- faróis -->
    <rect x="118" y="352" width="34" height="20" rx="8" fill="#fef9c3"/>
    <rect x="648" y="352" width="30" height="18" rx="7" fill="#fca5a5"/>

    <!-- maçanetas -->
    <rect x="318" y="330" width="46" height="11" rx="5.5" fill="#1e3a8a" opacity=".8"/>
    <rect x="446" y="330" width="46" height="11" rx="5.5" fill="#1e3a8a" opacity=".8"/>

    <!-- rodapé -->
    <rect x="112" y="386" width="576" height="18" fill="#1e3a8a" opacity=".55"/>

    <!-- rodas -->
    <g>
      <circle cx="216" cy="404" r="54" fill="#0f172a"/>
      <circle cx="216" cy="404" r="32" fill="url(#rim)"/>
      <circle cx="216" cy="404" r="13" fill="#475569"/>
      <g stroke="#64748b" stroke-width="6" stroke-linecap="round">
        <path d="M216 376v14M216 418v14M188 404h14M230 404h14"/>
      </g>
    </g>
    <g>
      <circle cx="584" cy="404" r="54" fill="#0f172a"/>
      <circle cx="584" cy="404" r="32" fill="url(#rim)"/>
      <circle cx="584" cy="404" r="13" fill="#475569"/>
      <g stroke="#64748b" stroke-width="6" stroke-linecap="round">
        <path d="M584 376v14M584 418v14M556 404h14M598 404h14"/>
      </g>
    </g>
  </g>

  <!-- linhas de movimento -->
  <g stroke="#93c5fd" stroke-opacity=".3" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M20 300h84"/>
    <path d="M40 340h52"/>
    <path d="M700 292h80"/>
    <path d="M726 332h54"/>
  </g>
</svg>