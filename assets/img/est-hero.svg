<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-label="Estética e bem-estar">
  <defs>
    <linearGradient id="h1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b0a2b"/><stop offset=".55" stop-color="#701a45"/><stop offset="1" stop-color="#2b061d"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd9c0"/><stop offset="1" stop-color="#e8b49a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/><stop offset=".5" stop-color="#f59e0b"/><stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  </defs>

  <rect width="800" height="620" fill="url(#h1)"/>

  <g filter="url(#glow)" opacity=".55">
    <circle cx="180" cy="150" r="140" fill="#db2777"/>
    <circle cx="640" cy="470" r="150" fill="#f59e0b"/>
  </g>

  <!-- anéis dourados -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.6" opacity=".45">
    <circle cx="400" cy="310" r="145"/>
    <circle cx="400" cy="310" r="215"/>
    <circle cx="400" cy="310" r="285"/>
  </g>

  <!-- perfil estilizado -->
  <g transform="translate(400 300)">
    <path d="M40-160c62 0 112 40 124 96 6 30-4 52-20 66-8 8-10 18-6 28l14 40c8 24-6 46-30 52-22 6-42 18-56 36l-16 22h-64c8-26 6-48-6-72-16-30-22-62-22-96 0-96 50-172 82-172z"
          fill="url(#skin)"/>
    <!-- cabelo -->
    <path d="M40-160c-32 0-82 76-82 172 0 26 3 50 9 70 4-84 26-140 44-160 22 26 60 34 92 18 26-14 40-40 46-66-8-22-58-34-109-34z"
          fill="#4c1d3d"/>
    <!-- olho -->
    <path d="M-4-34c14-12 34-12 48 0-14 14-34 14-48 0z" fill="#3f1d2e"/>
    <circle cx="20" cy="-34" r="8" fill="#1b0d16"/>
    <circle cx="23" cy="-37" r="3" fill="#fff"/>
    <!-- sobrancelha -->
    <path d="M-10-58c16-8 36-6 50 4" fill="none" stroke="#4c1d3d" stroke-width="6" stroke-linecap="round"/>
    <!-- lábio -->
    <path d="M22 66c10 6 22 6 32-2-12-2-22-2-32 2z" fill="#b03a62"/>
    <!-- brinco -->
    <circle cx="-8" cy="10" r="9" fill="url(#gold)"/>
  </g>

  <!-- folhagens -->
  <g stroke="#f9a8d4" stroke-opacity=".35" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M90 560c0-70 50-120 120-140"/>
    <path d="M710 560c0-70-50-120-120-140"/>
  </g>
</svg>