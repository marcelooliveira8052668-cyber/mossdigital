<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Sala de atendimento">
  <defs>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e0a22"/><stop offset="1" stop-color="#4a1130"/></linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="b1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#a1)"/>
  <g filter="url(#b1)" opacity=".45">
    <circle cx="180" cy="140" r="120" fill="#db2777"/>
    <circle cx="640" cy="470" r="130" fill="#f59e0b"/>
  </g>

  <!-- maca -->
  <rect x="140" y="360" width="520" height="42" rx="21" fill="#f5e6f0"/>
  <rect x="140" y="402" width="520" height="16" rx="8" fill="#d8bdd0" opacity=".7"/>
  <rect x="170" y="418" width="18" height="70" rx="9" fill="url(#a2)"/>
  <rect x="612" y="418" width="18" height="70" rx="9" fill="url(#a2)"/>

  <!-- luminária -->
  <rect x="380" y="70" width="40" height="70" rx="20" fill="#7c2d52"/>
  <ellipse cx="400" cy="150" rx="34" ry="12" fill="#fde68a" opacity=".85"/>
  <path d="M366 150 320 330h160l-46-180z" fill="#fde68a" opacity=".12"/>

  <!-- bandeja de instrumentos -->
  <rect x="560" y="300" width="170" height="16" rx="8" fill="#7c2d52"/>
  <g fill="#fde68a" opacity=".85">
    <circle cx="600" cy="288" r="9"/><circle cx="632" cy="288" r="7"/><circle cx="662" cy="288" r="9"/>
  </g>

  <!-- planta -->
  <g stroke="#f9a8d4" stroke-opacity=".4" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M120 540c0-40 30-70 70-70"/>
    <path d="M680 540c0-40-30-70-70-70"/>
  </g>
</svg>