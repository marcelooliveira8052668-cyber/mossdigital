<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-label="Alimentos e bebida">
  <defs>
    <linearGradient id="f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b1206"/><stop offset=".55" stop-color="#7c2d12"/><stop offset="1" stop-color="#2b0d04"/></linearGradient>
    <linearGradient id="pz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <filter id="fg" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="46"/></filter>
  </defs>
  <rect width="800" height="620" fill="url(#f1)"/>
  <g filter="url(#fg)" opacity=".5">
    <circle cx="180" cy="160" r="140" fill="#f59e0b"/>
    <circle cx="640" cy="470" r="150" fill="#ef4444"/>
  </g>

  <!-- pizza -->
  <g transform="translate(400 320)">
    <circle cx="0" cy="18" r="168" fill="#d97706"/>
    <circle cx="0" cy="0" r="168" fill="#fcd34d"/>
    <circle cx="0" cy="0" r="148" fill="url(#pz)"/>
    <g fill="#b45309" opacity=".55">
      <path d="M-150 0a150 150 0 0 1 150-150v300A150 150 0 0 1-150 0z" fill="#fde68a" opacity=".3"/>
    </g>
    <!-- queijo -->
    <g fill="#fde68a">
      <circle cx="-70" cy="-60" r="20"/><circle cx="60" cy="-80" r="24"/>
      <circle cx="90" cy="40" r="18"/><circle cx="-30" cy="90" r="22"/>
      <circle cx="-110" cy="50" r="17"/>
    </g>
    <!-- calabresa -->
    <g fill="#b91c1c">
      <circle cx="-20" cy="-20" r="19"/><circle cx="70" cy="20" r="17"/>
      <circle cx="-60" cy="70" r="16"/><circle cx="20" cy="110" r="15"/>
      <circle cx="-130" cy="-40" r="15"/><circle cx="130" cy="-30" r="14"/>
    </g>
    <!-- manjericão -->
    <g fill="#15803d">
      <ellipse cx="10" cy="-120" rx="18" ry="9" transform="rotate(-18 10 -120)"/>
      <ellipse cx="-100" cy="20" rx="17" ry="9" transform="rotate(24 -100 20)"/>
      <ellipse cx="120" cy="90" rx="16" ry="8" transform="rotate(-30 120 90)"/>
    </g>
  </g>

  <!-- vapor -->
  <g stroke="#fbbf24" stroke-opacity=".3" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M300 120c14-18-14-32 0-50"/><path d="M500 108c16-20-12-34 2-52"/>
  </g>
</svg>