<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carregando...</title>
  <meta name="description" content="">

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <!-- ================= CABEÇALHO ================= -->
  <header class="header">
    <div class="container header__inner">

      <a class="brand" href="#inicio">
        <img src="assets/img/logo.svg" alt="Logo">
        <span class="brand__name"></span>
      </a>

      <ul class="nav" id="nav"></ul>

      <div class="header__actions">
        <a class="btn btn--wa" id="waTop" href="#">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
            <path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.8 14.2c-.2.7-1.3 1.3-1.9 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.2-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.5-.4.7-.4h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.2 1.4 2.5 1.5.3.1.4.1.6-.1l.9-1c.2-.2.4-.2.6-.1l1.9.9c.2.1.4.2.5.3.1.2.1.7-.1 1.3z"/>
          </svg>
          <span>WhatsApp</span>
        </a>

        <button class="icon-btn" id="themeToggle" aria-label="Alternar tema"></button>

        <button class="icon-btn nav-toggle" id="navToggle" aria-label="Abrir menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M3 6h18M3 12h18M3 18h18"/>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <main id="conteudo">

    <!-- ================= HERO ================= -->
    <section class="hero" id="inicio">
      <div class="container hero__grid">

        <div class="hero__text">
          <span class="eyebrow" id="heroTag"></span>
          <h1 id="heroTitle"></h1>
          <p class="hero__sub" id="heroSub"></p>

          <div class="hero__actions">
            <a class="btn btn--primary" id="heroWhats">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                <path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.8 14.2c-.2.7-1.3 1.3-1.9 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.2-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.5-.4.7-.4h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.2 1.4 2.5 1.5.3.1.4.1.6-.1l.9-1c.2-.2.4-.2.6-.1l1.9.9c.2.1.4.2.5.3.1.2.1.7-.1 1.3z"/>
              </svg>
              <span id="heroPrimary">Pedir agora</span>
            </a>
            <a class="btn btn--ghost" id="heroSecondary">Ver cardápio</a>
          </div>
        </div>

        <div class="hero__media">
          <img id="heroImg" src="" alt="">
          <div class="hero__badge">
            <span class="stars">★★★★★</span>
            <span>
              <strong>4.9</strong>
              <span>Google · +12 mil pedidos</span>
            </span>
          </div>
        </div>

      </div>
    </section>

    <!-- ================= ESTATÍSTICAS ================= -->
    <section class="stats">
      <div class="container">
        <div class="stats__grid" id="statsGrid"></div>
      </div>
    </section>

    <!-- ================= CARDÁPIO / SERVIÇOS ================= -->
    <section class="section" id="cardapio">
      <div class="container">
        <div class="section-head" data-reveal>
          <span class="tag" id="cardapioTag"></span>
          <h2 id="cardapioTitle"></h2>
          <p id="cardapioDesc"></p>
        </div>
        <div class="cards" id="cardsGrid"></div>
      </div>
    </section>

    <!-- ================= SOBRE ================= -->
    <section class="section section--alt" id="sobre">
      <div class="container about__grid">
        <div class="about__media" data-reveal>
          <img id="aboutImg" src="" alt="">
        </div>
        <div class="about__text" data-reveal>
          <span class="tag" id="aboutTag"></span>
          <h2 id="aboutTitle"></h2>
          <p id="aboutText"></p>
          <div class="about__stats" id="aboutStats"></div>
          <a class="btn btn--primary" id="aboutCta" href="#contato">Fazer um pedido</a>
        </div>
      </div>
    </section>

    <!-- ================= GALERIA / PORTFÓLIO ================= -->
    <section class="section" id="galeria">
      <div class="container">
        <div class="section-head" data-reveal>
          <span class="tag" id="galeriaTag"></span>
          <h2 id="galeriaTitle"></h2>
          <p id="galeriaDesc"></p>
        </div>
        <div class="filters" id="filters"></div>
        <div class="gallery" id="galleryGrid"></div>
      </div>
    </section>

    <!-- ================= CONTATO ================= -->
    <section class="section contact" id="contato">
      <div class="container">

        <div class="section-head" data-reveal>
          <span class="tag" id="contactTag"></span>
          <h2 id="contactTitle"></h2>
          <p id="contactSub"></p>
        </div>

        <div class="contact__grid">

          <!-- Informações -->
          <div class="info" data-reveal>
            <div class="info__item">
              <span class="info__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
              </span>
              <span>
                <span class="info__label">Telefone</span>
                <span class="info__value" id="infoPhone"></span>
              </span>
            </div>

            <div class="info__item">
              <span class="info__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
              </span>
              <span>
                <span class="info__label">E-mail</span>
                <span class="info__value" id="infoEmail"></span>
              </span>
            </div>

            <div class="info__item">
              <span class="info__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
              </span>
              <span>
                <span class="info__label">Endereço</span>
                <span class="info__value" id="infoAddress"></span>
              </span>
            </div>

            <div class="info__item">
              <span class="info__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              </span>
              <span>
                <span class="info__label">Funcionamento</span>
                <span class="info__value" id="infoHours"></span>
              </span>
            </div>

            <div class="socials" id="socials"></div>
          </div>

          <!-- Formulário (os campos vêm do config.js) -->
          <form class="form" id="leadForm" novalidate data-reveal>
            <h3 class="form__title" id="formTitle"></h3>
            <div id="formFields"></div>

            <button type="submit" class="btn btn--primary btn--block" id="fSubmit">
              <span>Enviar</span>
            </button>

            <a class="btn btn--wa btn--block" id="waForm" href="#" style="margin-top:12px">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                <path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.8 14.2c-.2.7-1.3 1.3-1.9 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.2-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.5-.4.7-.4h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.2 1.4 2.5 1.5.3.1.4.1.6-.1l.9-1c.2-.2.4-.2.6-.1l1.9.9c.2.1.4.2.5.3.1.2.1.7-.1 1.3z"/>
              </svg>
              <span>Ou chame no WhatsApp</span>
            </a>

            <p class="form__msg" id="formMsg" role="status" aria-live="polite"></p>
          </form>

        </div>

        <div class="map" data-reveal>
          <iframe id="map" title="Mapa" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>

      </div>
    </section>

  </main>

  <!-- ================= RODAPÉ ================= -->
  <footer class="footer">
    <div class="container">
      <div class="footer__grid">

        <div class="footer__brand">
          <img src="assets/img/logo-white.svg" alt="Logo">
          <p id="footerDesc"></p>
        </div>

        <div>
          <h3>Navegação</h3>
          <ul id="footerNav"></ul>
        </div>

        <div>
          <h3>Contato</h3>
          <ul>
            <li><a href="#" id="footerPhone"></a></li>
            <li><a href="#" id="footerEmail"></a></li>
          </ul>
        </div>

      </div>

      <div class="footer__bottom">
        <span id="footerCredit"></span>
        <span>Feito com <span style="color:var(--accent)">&#10084;</span> para o seu negócio</span>
      </div>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
